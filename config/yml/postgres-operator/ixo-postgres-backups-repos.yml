- name: repo1
%{ if s3_bucket != "" ~}
  s3:
    bucket: ${s3_bucket}
    endpoint: s3.${s3_region}.amazonaws.com
    region: ${s3_region}
%{ else ~}
  gcs:
    bucket: ${gcs_bucket}
%{ endif ~}
  schedules:
    full: "0 2 * * 0"  # Full backup every Sunday at 2 AM
    differential: "0 2 * * 1-6"  # Differential backup Monday to Saturday at 2 AM
- name: ixo-postgresql-0
  replicas: 2
  metadata:
    labels:
      app.kubernetes.io/part-of: ixo
      app.kubernetes.io/name: ixo-postgres
%{ if !enable_otel ~}
  containers:
    - name: promtail
      image: grafana/promtail:latest
      imagePullPolicy: IfNotPresent
      args:
        - -config.file=/conf/promtail.yaml
      volumeMounts:
        - name: postgres-data
          mountPath: /pgdata
        # Provided by spec.monitoring.pgmonitor.exporter.configuration, which projects
        # promtail-config into this volume. It exists only while that block is set: the CRD
        # offers no other way to mount a ConfigMap into an instance pod, as
        # instances[].volumes.additional accepts only PVCs or OCI images. This sidecar is
        # therefore omitted when the OpenTelemetry collector is used instead.
        - name: exporter-config
          readOnly: false
          mountPath: /conf
      resources:
        limits:
          memory: 256Mi
        requests:
          cpu: 50m
          memory: 128Mi
%{ endif ~}
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      memory: 2Gi
  dataVolumeClaimSpec:
    storageClassName: "vultr-block-storage"
    accessModes:
      - "ReadWriteOnce"
    resources:
      requests:
        storage: ${storage_size}

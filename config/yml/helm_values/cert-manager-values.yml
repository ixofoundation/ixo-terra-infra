# Exact challenge paths never match under nginx.org/path-regex (matrix Ingress).
featureGates: "ACMEHTTP01IngressPathTypeExact=false"
installCRDs: true
resources:
  limits:
    memory: 64Mi
  requests:
    cpu: 10m
    memory: 32Mi
webhook:
  resources:
    limits:
      memory: 64Mi
    requests:
      cpu: 10m
      memory: 32Mi
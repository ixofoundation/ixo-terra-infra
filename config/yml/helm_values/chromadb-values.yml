image:
  allowReset: true
  persistDirectory: /index-data
  repository: chromadb/chroma
  apiVersion: "latest"
  base: ""

chromadb:
%{ if api_version != "" ~}
  # Image tag pin. The chart reads chromadb.apiVersion, not image.apiVersion above (that key is ignored).
  apiVersion: "${api_version}"
%{ endif ~}
  auth:
    enabled: false
  data:
    volumeSize: ${volume_size}
    storageClass: ${storage_class}
    retentionPolicyOnDelete: Retain

resources:
  requests:
    cpu: 50m
    memory: 200Mi
  limits:
    memory: 600Mi
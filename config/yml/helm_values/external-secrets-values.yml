serviceAccount:
  name: external-secrets
resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 128Mi
webhook:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi
certController:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi
# ClusterSecretStore is delivered with the chart so ArgoCD applies the ESO CRDs first.
# The first sync may need a retry while the ESO webhook comes up.
extraObjects:
  - apiVersion: external-secrets.io/v1
    kind: ClusterSecretStore
    metadata:
      name: vault
    spec:
      provider:
        vault:
          server: http://vault-active.vault.svc.cluster.local:8200 # Same address the AVP sidecar uses
          path: ${vault_mount}
          version: v2
          auth:
            kubernetes:
              mountPath: kubernetes
              role: external-secrets
              serviceAccountRef:
                name: external-secrets
                namespace: external-secrets

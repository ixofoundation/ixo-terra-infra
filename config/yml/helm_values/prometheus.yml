#file: noinspection YAMLSchemaValidation
alertmanager:
  alertmanagerSpec:
    # Mount the webhook secret so config can reference it via file path
    secrets:
      - alertmanager-slack-webhook
    resources:
      requests:
        cpu: 40m
        memory: 200Mi
      limits:
        memory: 400Mi
  templateFiles:
    slack.tmpl: |-
      {{ define "slack.ixo.title" -}}
      {{ if gt (len .Alerts.Firing) 0 -}}:red_circle:{{ else -}}:large_green_circle:{{ end }} [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ len .Alerts.Firing }}{{ end }}] {{ if .CommonLabels.name }}{{ .CommonLabels.name }}{{ else }}{{ .CommonLabels.alertname }}{{ end }}
      {{- end }}
      {{ define "slack.ixo.context" -}}
      {{ if .Labels.pod -}}{{ .Labels.pod }}{{ if .Labels.kubernetes_namespace }} ({{ .Labels.kubernetes_namespace }}){{ end -}}
      {{ else if .Labels.instance -}}{{ .Labels.instance -}}
      {{ else -}}cluster-wide{{ end -}}
      {{- end }}
      {{ define "slack.ixo.text" -}}
      {{ if .Alerts.Firing -}}
      *Firing:*
      {{ range .Alerts.Firing -}}
      • {{ if .Labels.name }}*{{ .Labels.name }}*{{ else }}*{{ .Labels.alertname }}*{{ end }} on {{ template "slack.ixo.context" . }}
        {{ .Annotations.summary }}
      {{ end -}}
      {{ end -}}
      {{ if .Alerts.Resolved -}}
      *Resolved:*
      {{ range .Alerts.Resolved -}}
      • {{ if .Labels.name }}{{ .Labels.name }}{{ else }}{{ .Labels.alertname }}{{ end }} on {{ template "slack.ixo.context" . }}
      {{ end -}}
      {{ end -}}
      {{- end }}
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname', 'kubernetes_namespace', 'severity']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: slack-notifications
      routes:
        - matchers:
            - severity = critical
          repeat_interval: 1h
    receivers:
      - name: slack-notifications
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-slack-webhook/webhook-url
            title: '{{ template "slack.ixo.title" . }}'
            text: '{{ template "slack.ixo.text" . }}'
            send_resolved: true
    templates:
      - /etc/alertmanager/config/*.tmpl
defaultRules:
  rules:
    alertmanager: false
    etcd: false
    configReloaders: false
    general: false
    k8sContainerCpuUsageSecondsTotal: true
    k8sContainerMemoryCache: true
    k8sContainerMemoryRss: true
    k8sContainerMemorySwap: true
    k8sContainerResource: true
    k8sContainerMemoryWorkingSetBytes: true
    k8sPodOwner: false
    kubeApiserverAvailability: false
    kubeApiserverBurnrate: false
    kubeApiserverHistogram: false
    kubeApiserverSlos: false
    kubeControllerManager: false
    kubelet: false
    kubeProxy: false
    kubePrometheusGeneral: false
    kubePrometheusNodeRecording: false
    kubernetesApps: false
    kubernetesResources: false
    kubernetesStorage: false
    kubernetesSystem: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeStateMetrics: false
    network: false
    node: true
    nodeExporterAlerting: false
    nodeExporterRecording: false
    prometheus: false
    prometheusOperator: false
    windows: false
prometheus:
  additionalRulesForClusterRole:
    - apiGroups: [""]
      resources:
        - nodes/metrics
        - nodes/stats
        - nodes/proxy
      verbs: ["get", "list", "watch"]
  prometheusSpec:
    replicas: 1
    resources:
      requests:
        cpu: 300m
        memory: 600Mi
      limits:
        memory: 900Mi
    #https://github.com/CrunchyData/postgres-operator-examples/blob/main/kustomize/monitoring/prometheus/config/prometheus.yml
    additionalScrapeConfigs:
      ${indent(6, additional_scrape_metrics)}
      - job_name: 'cvms-exporter'
        metrics_path: '/metrics'
        scheme: 'http'
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [ __meta_kubernetes_service_name, __meta_kubernetes_namespace ]
            action: keep
            regex: ixo-cvms-exporter;core
          - source_labels: [ __meta_kubernetes_endpoint_port_name ]
            action: keep
            regex: metrics
      - job_name: 'hermes-telemetry'
        metrics_path: '/metrics'
        scheme: 'http'
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [ __meta_kubernetes_service_name, __meta_kubernetes_namespace ]
            action: keep
            regex: hermes-telemetry;core
          - source_labels: [ __meta_kubernetes_endpoint_port_name ]
            action: keep
            regex: telemetry
      - job_name: blackbox
        metrics_path: /probe
        params:
          module: [ http_2xx ]
        static_configs:
          - targets:
              ${indent(14, blackbox_targets)}
        relabel_configs:
          - source_labels: [ __address__ ]
            target_label: __param_target
          - source_labels: [ __param_target ]
            target_label: target
          - target_label: __address__
            replacement: prometheus-blackbox-exporter.prometheus-blackbox-exporter:9115
      - job_name: 'crunchy-postgres-exporter'
        kubernetes_sd_configs:
          - role: pod
            selectors:
              - role: pod
                # Selects on cluster membership rather than the exporter-specific label, so
                # this job keeps working across the pgmonitor-exporter -> OTel-collector
                # migration. Both serve Prometheus metrics on 9187, and the keep-rule below
                # drops every pod that does not expose that port.
                label: postgres-operator.crunchydata.com/cluster
        relabel_configs:
          # Keep exporter/collector port and drop all others
          - source_labels: [ __meta_kubernetes_pod_container_port_number ]
            action: keep
            regex: 9187
          # Set label for namespace
          - source_labels: [ __meta_kubernetes_namespace ]
            target_label: kubernetes_namespace
          # Set label for pod name
          - source_labels: [ __meta_kubernetes_pod_name ]
            target_label: pod
          # Convert namespace and cluster name to pg_cluster=namespace:cluster
          - source_labels: [ __meta_kubernetes_namespace,__meta_kubernetes_pod_label_postgres_operator_crunchydata_com_cluster ]
            target_label: pg_cluster
            separator: ":"
            replacement: '$1$2'
          # Convert kubernetes pod ip to ip
          - source_labels: [ __meta_kubernetes_pod_ip ]
            target_label: ip
          # Convert postgres-operator.crunchydata.com/instance to deployment
          - source_labels: [ __meta_kubernetes_pod_label_postgres_operator_crunchydata_com_instance ]
            target_label: deployment
          # Convert postgres-operator.crunchydata.com/role to role
          - source_labels: [ __meta_kubernetes_pod_label_postgres_operator_crunchydata_com_role ]
            target_label: role
      - job_name: 'loki' # Loki Scrapes
        kubernetes_sd_configs:
          - role: service
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name, __meta_kubernetes_namespace]
            action: keep
            regex: loki;loki
          - source_labels: [__meta_kubernetes_service_port_name]
            action: keep
            regex: http-metrics
      - job_name: 'crunchy-postgres-exporter-v4'
        kubernetes_sd_configs:
          - role: pod
            selectors:
              - role: pod
                label: crunchy-postgres-exporter=true

        relabel_configs:
          # Keep exporter port and drop all others
          - source_labels: [ __meta_kubernetes_pod_container_port_number ]
            action: keep
            regex: 9187
          # Set label for namespace
          - source_labels: [ __meta_kubernetes_namespace ]
            target_label: kubernetes_namespace
          # Set label for pod name
          - source_labels: [ __meta_kubernetes_pod_name ]
            target_label: pod
          # Convert namespace and cluster name to pg_cluster=namespace:cluster
          - source_labels: [ __meta_kubernetes_namespace,__meta_kubernetes_pod_label_pg_cluster ]
            target_label: pg_cluster
            separator: ":"
            replacement: '$1$2'
          # Convert kubernetes pod ip to ip
          - source_labels: [ __meta_kubernetes_pod_ip ]
            target_label: ip
          # Set deployment_name as deployment label
          - source_labels: [ __meta_kubernetes_pod_label_deployment_name ]
            target_label: deployment
          # Set label for role
          - source_labels: [ __meta_kubernetes_pod_label_role ]
            target_label: role
      # Synapse main process and workers, for the ixo.synapse rules. Each pod exposes over
      # a thousand series; only the few the rules and their diagnosis need are kept.
      - job_name: 'synapse'
        metrics_path: /_synapse/metrics
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - matrix-synapse
            selectors:
              - role: pod
                label: app.kubernetes.io/name=matrix-synapse
        relabel_configs:
          # The metrics port (9090) of the main process and each worker; drops the well-known server
          - source_labels: [ __meta_kubernetes_pod_container_port_name ]
            action: keep
            regex: metrics
          # synapse (main process), appservice or generic-worker
          - source_labels: [ __meta_kubernetes_pod_label_app_kubernetes_io_component ]
            target_label: component
          - source_labels: [ __meta_kubernetes_namespace ]
            target_label: kubernetes_namespace
          - source_labels: [ __meta_kubernetes_pod_name ]
            target_label: pod
        metric_relabel_configs:
          - source_labels: [ __name__ ]
            action: keep
            regex: synapse_appservice_api_(sent|failed)_[a-z]+_total|synapse_event_persisted_position|synapse_event_processing_positions|synapse_background_update_status|process_resident_memory_bytes
    rule_files:
      - /etc/prometheus/alert-rules.d/*.yml
    alerting:
      alertmanagers:
        - kubernetes_sd_configs:
            - role: pod
              selectors:
                - role: pod
                  label: app.kubernetes.io/component=crunchy-alertmanager
        - kubernetes_sd_configs:
            - role: pod
              namespaces:
                names:
                  - prometheus
              selectors:
                - role: pod
                  label: app.kubernetes.io/name=alertmanager
grafana:
%{ if grafana_admin_secret != "" ~}
  # Admin credentials from a Terraform-managed Secret; the chart default changes on every ArgoCD render.
  admin:
    existingSecret: ${grafana_admin_secret}
    userKey: admin-user
    passwordKey: admin-password
%{ endif ~}
  sidecar:
    skipTlsVerify: true
  plugins:
    - nline-plotlyjs-panel
  env:
    CLIENT_SECRET: ${grafana_oidc_secret}
  deploymentStrategy:
    type: Recreate
  livenessProbe:
    # The annotation dashboard_uid migration runs before the HTTP server starts listening
    # and takes ~2 minutes against the bulk (HDD) volume; with max_open_conn=1 below,
    # everything else queues behind it. At 60s the probe killed Grafana mid-migration and
    # it never got far enough to serve /api/health. Must stay comfortably above that scan.
    initialDelaySeconds: 300
    failureThreshold: 10
  readinessProbe:
    initialDelaySeconds: 60
    # Chart default of 1s fails on a fresh DB while the sidecar provisions dashboards.
    timeoutSeconds: 10
  persistence:
    enabled: true
    type: pvc
    storageClassName: ${storage_class}
    accessModes:
      - ReadWriteOnce
    size: 40Gi
    finalizers:
      - kubernetes.io/pvc-protection
  grafana.ini:
    database:
      wal: true
      cache_mode: shared
      migration_locking: false
      # SQLite connection pool, set per env in modules.tf. 1 avoids SQLITE_BUSY during the
      # 12.4.3 annotation migration; a fresh DB needs more or it deadlocks on first boot.
      max_open_conn: ${grafana_max_open_conn}
      max_idle_conn: ${grafana_max_open_conn}
      # Retries alone do NOT fix the above — they are spaced ~10ms apart, so even 50 of
      # them span only ~0.5s while the lock is held for minutes. Kept as cheap insurance.
      query_retries: 25
      transaction_retries: 50
    auth.generic_oauth:
      client_id: grafana-client
      client_secret: $__env{CLIENT_SECRET}
      auth_url: https://${dex_host}/auth
      api_url: https://${dex_host}/userinfo
      token_url: https://${dex_host}/token
      scopes: 'openid profile email groups'
      use_refresh_token: true
      groups_attribute_path: 'groups'
      allowed_groups: '${org}:ixo_core, ${org}:${oidc_team}-devsecops'
      role_attribute_path: contains(groups[*], '${org}:${oidc_team}-devsecops') && 'GrafanaAdmin' || 'Viewer'
      allow_assign_grafana_admin: false
      enabled: true
    server:
      domain: ${host}
      protocol: http
      root_url: "%(protocol)s://%(domain)s/grafana/"
      serve_from_sub_path: true
  ingress:
    enabled: false  # Routing via F5 VirtualServer (prometheus-stack-host) and VirtualServerRoute grafana-route
    ingressClassName: nginx
    annotations:
      nginx.org/mergeable-ingress-type: "minion"
      nginx.org/path-regex: "case_insensitive"
      cert-manager.io/cluster-issuer: letsencrypt-staging
    hosts:
      - ${host}
    path: /grafana(/|$)(.*)
    pathType: ImplementationSpecific
    tls:
      - secretName: grafana-tls
        hosts:
          - ${host}
  additionalDataSources:
    - name: loki
      access: proxy
      type: loki
      url: http://loki.loki.svc.cluster.local:3100
prometheusOperator:
  prometheusConfigReloader:
    resources:
      request:
        cpu: 50m
        memory: 50Mi
      limits:
        memory: 50Mi
  admissionWebhooks:
    deployment:
      resources:
        requests:
          cpu: 50m
          memory: 100Mi
        limits:
          memory: 200Mi
  tls:
    enabled: true
  resources:
    limits:
      memory: 200Mi
    requests:
      memory: 100Mi
      cpu: 100m
additionalPrometheusRulesMap:
  ixo-infrastructure-rules:
    groups:
      # The two metric namespaces are mutually exclusive: the OTel collector publishes
      # pgMonitor's ccp_* series, the retired pgmonitor exporter published postgres_exporter's
      # pg_* series. Rules are selected by the same flag that switches the clusters, so an
      # environment never ends up with rules that silently match nothing.
%{ if pg_enable_otel ~}
      - name: ixo.postgres
        rules:
          - alert: PostgresInstanceDown
            # Scrape health rather than a payload metric, so this survives future exporter
            # changes and also fires when the collector itself is down.
            expr: up{job="crunchy-postgres-exporter"} == 0
            for: 1m
            labels:
              severity: critical
              name: PostgresInstanceDown
            annotations:
              summary: "{{ $labels.pod }} in {{ $labels.kubernetes_namespace }} is unreachable"

          - alert: PostgresConnectionSaturation
            # ccp_connection_stats is already per-instance (not per-database) and both series
            # come from the same query, so the labels match without an explicit on() clause.
            expr: |
              ccp_connection_stats_total / ccp_connection_stats_max_connections > 0.80
            for: 5m
            labels:
              severity: warning
              name: PostgresConnectionSaturation
            annotations:
              summary: "{{ $labels.pod }} ({{ $labels.pg_cluster }}) connections at {{ $value | humanizePercentage }}"

          - alert: PostgresLongRunningTransaction
            # ccp_connection_stats has no datname label, so the old system-database filter is
            # gone. Covers both a long-running query and a session parked idle in transaction,
            # which together are what the old max_tx_duration series caught.
            expr: |
              ccp_connection_stats_max_query_time > 300
                or ccp_connection_stats_max_idle_in_txn_time > 300
            for: 2m
            labels:
              severity: warning
              name: PostgresLongRunningTransaction
            annotations:
              summary: "{{ $labels.pod }} in {{ $labels.kubernetes_namespace }} has a transaction open for {{ $value | humanizeDuration }}"

          - alert: PostgresReplicationLag
            # replay_time is zero when last WAL received equals last WAL replayed, so this
            # does not false-positive when the primary simply stops writing.
            expr: ccp_replication_lag_replay_time{role="replica"} > 300
            for: 5m
            labels:
              severity: warning
              name: PostgresReplicationLag
            annotations:
              summary: "{{ $labels.pod }} ({{ $labels.pg_cluster }}) replica is {{ $value | humanizeDuration }} behind primary"
%{ else ~}
      # Legacy pgmonitor exporter rules. Kept verbatim for environments still on the
      # exporter; they disappear the moment that environment sets use_otel.
      - name: ixo.postgres
        rules:
          - alert: PostgresInstanceDown
            expr: pg_up == 0
            for: 1m
            labels:
              severity: critical
              name: PostgresInstanceDown
            annotations:
              summary: "{{ $labels.pod }} in {{ $labels.kubernetes_namespace }} is unreachable"

          - alert: PostgresConnectionSaturation
            # pg_stat_database_numbackends is per-database; sum to get total per instance
            expr: |
              sum by (instance, pod, kubernetes_namespace, pg_cluster, role) (pg_stat_database_numbackends)
              / on (instance, pod, kubernetes_namespace, pg_cluster, role)
              pg_settings_max_connections > 0.80
            for: 5m
            labels:
              severity: warning
              name: PostgresConnectionSaturation
            annotations:
              summary: "{{ $labels.pod }} ({{ $labels.pg_cluster }}) connections at {{ $value | humanizePercentage }}"

          - alert: PostgresLongRunningTransaction
            # Excludes system databases; fires if any transaction has been open > 5 minutes
            expr: |
              pg_stat_activity_max_tx_duration{datname!~"template.*|postgres"} > 300
            for: 2m
            labels:
              severity: warning
              name: PostgresLongRunningTransaction
            annotations:
              summary: "{{ $labels.pod }} in {{ $labels.kubernetes_namespace }} has a transaction open for {{ $value | humanizeDuration }}"

          - alert: PostgresReplicationLag
            # Fires only on replicas; alert if replica is > 5 minutes behind primary
            expr: pg_replication_lag_seconds{role="replica"} > 300
            for: 5m
            labels:
              severity: warning
              name: PostgresReplicationLag
            annotations:
              summary: "{{ $labels.pod }} ({{ $labels.pg_cluster }}) replica is {{ $value | humanizeDuration }} behind primary"
%{ endif ~}

      - name: ixo.node
        rules:
          - alert: NodeMemoryPressure
            # Scoped to job="node-exporter" to exclude external nodes (e.g. validators) scraped via additional_scrape_metrics
            expr: |
              node_memory_MemAvailable_bytes{job="node-exporter"}
              / node_memory_MemTotal_bytes{job="node-exporter"} < 0.10
            for: 5m
            labels:
              severity: critical
              name: NodeMemoryPressure
            annotations:
              summary: "{{ $labels.instance }} has {{ $value | humanizePercentage }} memory available"

          - alert: NodeCPUSaturation
            # Scoped to job="node-exporter" to exclude external nodes
            expr: |
              avg by (instance) (rate(node_cpu_seconds_total{mode="idle", job="node-exporter"}[5m])) < 0.10
            for: 10m
            labels:
              severity: warning
              name: NodeCPUSaturation
            annotations:
              summary: "{{ $labels.instance }} CPU is {{ $value | humanizePercentage }} idle"

          - alert: NodeInodeExhaustion
            # Scoped to job="node-exporter" to exclude external nodes
            # Excludes tmpfs/overlay/squashfs which are virtual and have fixed counts
            expr: |
              node_filesystem_files_free{job="node-exporter", fstype!~"tmpfs|overlay|squashfs"}
              / node_filesystem_files{job="node-exporter", fstype!~"tmpfs|overlay|squashfs"} < 0.10
            for: 5m
            labels:
              severity: warning
              name: NodeInodeExhaustion
            annotations:
              summary: "{{ $labels.instance }} {{ $labels.mountpoint }} has {{ $value | humanizePercentage }} inodes free"

      - name: ixo.probes
        rules:
          - alert: ProbeDown
            # http_2xx probe: fails on DNS, connect, TLS or a non-2xx response, not only DNS
            expr: probe_success{job="blackbox"} == 0
            for: 5m
            labels:
              severity: critical
              name: ProbeDown
              # instance is the exporter address on probe series; Slack shows instance
              instance: "{{ $labels.target }}"
            annotations:
              summary: "{{ $labels.target }} is down (blackbox probe failing)"

          - alert: ProbeCertificateExpiring
            # cert-manager renews 30 days before expiry, so under 14 days means renewal has been failing
            expr: probe_ssl_earliest_cert_expiry{job="blackbox"} - time() < 14 * 86400
            for: 1h
            labels:
              severity: warning
              name: ProbeCertificateExpiring
              instance: "{{ $labels.target }}"
            annotations:
              summary: "{{ $labels.target }} TLS certificate expires in {{ $value | humanizeDuration }}"

          - alert: BlackboxScrapeFailing
            # A failed scrape leaves no probe_success series, so ProbeDown stays silent for that target.
            # Exporter down fails every target at once: count them into one alert.
            expr: count by (job, instance) (up{job="blackbox"} == 0) > 0
            for: 5m
            labels:
              severity: warning
              name: BlackboxScrapeFailing
            annotations:
              summary: "{{ $value }} blackbox probe scrapes failing; ProbeDown is blind for those targets"

      - name: ixo.loki
        rules:
          - alert: LokiIngestionDropped
            # Loki discarding samples means gaps in log observability
            expr: |
              sum by (reason) (rate(loki_discarded_samples_total[5m])) > 0
            for: 5m
            labels:
              severity: warning
              name: LokiIngestionDropped
            annotations:
              summary: "Loki dropping {{ $value | humanize }} samples/s (reason: {{ $labels.reason }})"

          - alert: LokiQueryLatencyHigh
            # p99 query latency > 30s means Grafana dashboards hang during incidents
            expr: |
              histogram_quantile(0.99,
                sum by (le) (
                  rate(loki_request_duration_seconds_bucket{route=~"loki_api_v1_query_range|loki_api_v1_query"}[5m])
                )
              ) > 30
            for: 5m
            labels:
              severity: warning
              name: LokiQueryLatencyHigh
            annotations:
              summary: "Loki query p99 latency is {{ $value | humanizeDuration }}"

      - name: ixo.synapse
        rules:
          - alert: SynapseAppserviceDown
            # Synapse has no metric for the DOWN state, so it is read from the transaction
            # counters of the appservice worker (one attempt = one sent or one failed).
            # After a failure Synapse marks the appservice DOWN and retries 2 s later, doubling
            # up to 512 s; with the 60 s HTTP timeout a long outage still fails at least every
            # ~9.5 min, which the 11m window bridges. A blip (one failure, the 2 s retry
            # succeeds) has its success after its failure, so the condition holds at most
            # 11m - 5m = 6m afterwards and for: 7m never fires on it. A real outage fires about
            # 12 min after the last successful transaction (sooner on a quiet network) and
            # resolves on the first success. Before the first failure since the worker started
            # there is no failed series and the expression is empty.
            expr: |
              sum by (kubernetes_namespace, service) (increase(synapse_appservice_api_failed_transactions_total{job="synapse"}[11m])) > 0
              unless on (kubernetes_namespace, service)
              sum by (kubernetes_namespace, service) (increase(synapse_appservice_api_sent_transactions_total{job="synapse"}[5m])) > 0
            for: 7m
            labels:
              severity: critical
              name: SynapseAppserviceDown
            annotations:
              summary: "Synapse cannot deliver to appservice {{ $labels.service }}: every transaction fails, none succeed. Check its pod first; if that is healthy, scale deploy/matrix-synapse-appservice to 0 then 1 (not rollout restart)"
              description: >-
                Synapse marked appservice {{ $labels.service }} DOWN and its retries keep failing,
                so room events and to-device messages for it are queued, not delivered.
                1) Check the appservice itself (ixoroomappservice = deploy/ixo-matrix-appservice-rooms,
                whatsapp = deploy/ixo-matrix-whatsapp, both in matrix-synapse): it must be running and
                answering. Synapse retries at least every 8.5 min and drains the queue by itself
                once it answers. 2) If the appservice is healthy and this keeps firing, run
                kubectl -n matrix-synapse scale deploy/matrix-synapse-appservice --replicas=0, then
                --replicas=1. Never kubectl rollout restart it.

          - alert: SynapseAppserviceSenderBehind
            # The appservice worker reads every persisted event to decide which appservices get
            # it. Normally its position is 0-2 events behind the main process (the two pods are
            # scraped at different moments); it works in batches of up to 100. Mainnet persists
            # ~40 events/min. Events are read and queued even while an appservice is DOWN, so
            # this catches a stuck worker, not a DOWN appservice.
            expr: |
              max by (kubernetes_namespace) (synapse_event_persisted_position{job="synapse"})
              - on (kubernetes_namespace)
              max by (kubernetes_namespace) (synapse_event_processing_positions{job="synapse", name="appservice_sender"})
              > 200
            for: 10m
            labels:
              severity: warning
              name: SynapseAppserviceSenderBehind
            annotations:
              summary: "Synapse appservice worker is {{ $value }} events behind: appservices get new events late"
              description: >-
                The appservice_sender position of matrix-synapse-appservice has been more than 200
                events behind the persisted event position for 10 minutes. Check the worker logs; if
                it is stuck, scale deploy/matrix-synapse-appservice to 0 then 1 (not rollout restart).

          - alert: SynapseAppserviceWorkerNotScraped
            # Without this target SynapseAppserviceDown and SynapseAppserviceSenderBehind are blind.
            expr: |
              sum by (kubernetes_namespace) (up{job="synapse", component="appservice"}) == 0
              or absent(up{job="synapse", component="appservice"})
            for: 10m
            labels:
              severity: critical
              name: SynapseAppserviceWorkerNotScraped
            annotations:
              summary: "Synapse appservice worker is down or not scraped: no appservice gets events, and the appservice alerts are blind"
              description: >-
                Prometheus has had no successful scrape of the matrix-synapse-appservice worker for
                10 minutes. Check the pod in matrix-synapse (kubectl -n matrix-synapse get pods -l
                app.kubernetes.io/component=appservice). If it is crash-looping or stuck, scale
                deploy/matrix-synapse-appservice to 0 then 1 (not rollout restart).

          - alert: SynapseMemoryNearLimit
            expr: |
              max by (namespace, pod) (container_memory_working_set_bytes{namespace="matrix-synapse", container="synapse"})
              / on (namespace, pod)
              max by (namespace, pod) (kube_pod_container_resource_limits{namespace="matrix-synapse", container="synapse", resource="memory"})
              > 0.90
            for: 15m
            labels:
              severity: warning
              name: SynapseMemoryNearLimit
            annotations:
              summary: "Synapse main process memory at {{ $value | humanizePercentage }} of its limit: it will be OOM-killed if it keeps growing"
              description: >-
                The working set of the synapse container has been above 90% of its memory limit for
                15 minutes. Look for a leak (memory growing steadily since the pod started) or a load
                spike. Restarting the pod frees memory but disconnects clients for about a minute;
                a lasting fix is a higher limit in matrix-values.yml or a Synapse fix.
image:
  pullPolicy: Always
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
    acme.cert-manager.io/http01-edit-in-place: "true"
  tls:
    - hosts:
        - ${host}
      secretName: ixo-domain-indexer-tls
  hosts:
    - host: ${host}
      paths:
        - path: /
          pathType: Prefix
service:
  port: 8080
%{ if eso_enabled ~}
externalSecret:
  enabled: true
  vaultPath: ixo-domain-indexer
%{ endif ~}
env:
  # Server Configuration
  - name: "NODE_ENV"
    value: "production"
  - name: "PORT"
    value: "8080"
  - name: "LOG_LEVEL"
    value: "info"
  - name: "CORS_ORIGIN"
    value: "*"
  - name: "RATE_LIMIT_MAX"
    value: "100"
  - name: "RATE_LIMIT_WINDOW_MS"
    value: "60000"
  
  # Database Configuration (SurrealDB)
  - name: "DB_URL"
    value: "ws://surrealdb.surrealdb.svc.cluster.local:8000/rpc"
  - name: "DB_NAMESPACE"
    value: "domain-indexer"
  - name: "DB_NAME"
    value: "domain-indexer"
%{ if !eso_enabled ~}
  - name: "SURREAL_USER"
    value: "<path:${vault_mount}/data/ixo-domain-indexer#SURREAL_USER>"
  - name: "SURREAL_PASS"
    value: "<path:${vault_mount}/data/ixo-domain-indexer#SURREAL_PASS>"
%{ endif ~}
  
  # AI Configuration
%{ if !eso_enabled ~}
  - name: "OPENAI_API_KEY"
    value: "<path:${vault_mount}/data/ixo-domain-indexer#OPENAI_API_KEY>"
  - name: "AI_MODEL"
    value: "<path:${vault_mount}/data/ixo-domain-indexer#AI_MODEL>"
  - name: "OPENAI_API_KEY_EMBEDDINGS"
    value: "<path:${vault_mount}/data/ixo-domain-indexer#OPENAI_API_KEY_EMBEDDINGS>"
%{ endif ~}
  - name: "AI_EMBEDDING_DIMENSION"
    value: "768"
  
  # Google Maps API
%{ if !eso_enabled ~}
  - name: "MAPS_API_KEY"
    value: "<path:${vault_mount}/data/ixo-domain-indexer#MAPS_API_KEY>"
%{ endif ~}
  
  # Firecrawl Configuration
%{ if !eso_enabled ~}
  - name: "FIRECRAWL_API_KEY"
    value: "<path:${vault_mount}/data/ixo-domain-indexer#FIRECRAWL_API_KEY>"
  - name: "FIRECRAWL_API_URL"
    value: "<path:${vault_mount}/data/ixo-domain-indexer#FIRECRAWL_API_URL>"
%{ endif ~}
  - name: "FIRECRAWL_TIMEOUT"
    value: "30000"
  
  # Feature Flags
%{ if !eso_enabled ~}
  - name: "SKIP_SOCIAL_LINKS"
    value: "<path:${vault_mount}/data/ixo-domain-indexer#SKIP_SOCIAL_LINKS>"
  - name: "ENABLE_IMAGE_ALT_GENERATION"
    value: "<path:${vault_mount}/data/ixo-domain-indexer#ENABLE_IMAGE_ALT_GENERATION>"
%{ endif ~}
  
  # Network
  - name: "NETWORK"
    value: "${environment}"
resources:
  requests:
    memory: 300Mi
    cpu: "40m"
  limits:
    memory: 600Mi
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 1
  targetMemoryUtilizationPercentage: "30"
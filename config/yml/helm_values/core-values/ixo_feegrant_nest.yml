image:
  pullPolicy: Always
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
    acme.cert-manager.io/http01-edit-in-place: "true"
  tls:
    - hosts:
        - ${host}
      secretName: ixo-feegrant-nest-tls
  hosts:
    - host: ${host}
      paths:
        - path: /
          pathType: Prefix
service:
  port: 3000
env:
  - name: "NODE_ENV"
    value: "production"
  - name: "RPC_URL"
    value: "${rpc_url}"
  - name: "PORT"
    value: "3000"
  - name: "AUTHORIZATION"
    value: "<path:${vault_mount}/data/ixo-feegrant-nest#AUTHORIZATION>"
  - name: "JAMBO_AUTHORIZATION"
    value: "<path:${vault_mount}/data/ixo-feegrant-nest#JAMBO_AUTHORIZATION>"
  - name: "MNEMONIC"
    value: "<path:${vault_mount}/data/ixo-feegrant-nest#MNEMONIC>"
  - name: "SENTRY_DSN"
    value: "<path:${vault_mount}/data/ixo-feegrant-nest#SENTRY_DSN>"
  - name: "DATABASE_URL"
    value: "postgresql://${pgUsername}:${pgPassword}@${pgCluster}-primary.${pgNamespace}.svc.cluster.local/${pgUsername}"
  - name: "DATABASE_USE_SSL"
    value: "1"
  - name: "MIGRATE_DB_PROGRAMATICALLY"
    value: "1"
  - name: "BLOCKSYNC_GRAPHQL_URL"
    value: "<path:${vault_mount}/data/ixo-feegrant-nest#BLOCKSYNC_GRAPHQL_URL>"
resources:
  requests:
    memory: 300Mi
    cpu: "40m"
  limits:
    memory: 600Mi
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 1
  targetMemoryUtilizationPercentage: "30"
image:
  pullPolicy: Always
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
    acme.cert-manager.io/http01-edit-in-place: "true"
  tls:
    - hosts:
        - ${host}
      secretName: ixo-yellowcard-oracle-tls
  hosts:
    - host: ${host}
      paths:
        - path: /
          pathType: Prefix
%{ if eso_enabled ~}
externalSecret:
  enabled: true
  vaultPath: ixo-yellowcard-oracle
%{ endif ~}
env:
  - name: NODE_ENV
    value: "production"
  - name: PORT
    value: "4000"
%{ if !eso_enabled ~}
  - name: ORACLE_NAME
    value: "<path:${vault_mount}/data/ixo-yellowcard-oracle#ORACLE_NAME>"
%{ endif ~}
  # Network
%{ if !eso_enabled ~}
  - name: NETWORK
    value: "<path:${vault_mount}/data/ixo-yellowcard-oracle#NETWORK>"
  - name: RPC_URL
    value: "<path:${vault_mount}/data/ixo-yellowcard-oracle#RPC_URL>"
  - name: BLOCKSYNC_GRAPHQL_URL
    value: "<path:${vault_mount}/data/ixo-yellowcard-oracle#BLOCKSYNC_GRAPHQL_URL>"
  - name: BLOCKSYNC_URI
    value: "<path:${vault_mount}/data/ixo-yellowcard-oracle#BLOCKSYNC_URI>"
%{ endif ~}
  # Matrix
%{ if !eso_enabled ~}
  - name: MATRIX_BASE_URL
    value: "<path:${vault_mount}/data/ixo-yellowcard-oracle#MATRIX_BASE_URL>"
  - name: MATRIX_ORACLE_ADMIN_ACCESS_TOKEN
    value: "<path:${vault_mount}/data/ixo-yellowcard-oracle#MATRIX_ORACLE_ADMIN_ACCESS_TOKEN>"
  - name: MATRIX_ORACLE_ADMIN_PASSWORD
    value: "<path:${vault_mount}/data/ixo-yellowcard-oracle#MATRIX_ORACLE_ADMIN_PASSWORD>"
  - name: MATRIX_ORACLE_ADMIN_USER_ID
    value: "<path:${vault_mount}/data/ixo-yellowcard-oracle#MATRIX_ORACLE_ADMIN_USER_ID>"
  - name: MATRIX_RECOVERY_PHRASE
    value: "<path:${vault_mount}/data/ixo-yellowcard-oracle#MATRIX_RECOVERY_PHRASE>"
  - name: MATRIX_VALUE_PIN
    value: "<path:${vault_mount}/data/ixo-yellowcard-oracle#MATRIX_VALUE_PIN>"
  - name: MATRIX_ACCOUNT_ROOM_ID
    value: "<path:${vault_mount}/data/ixo-yellowcard-oracle#MATRIX_ACCOUNT_ROOM_ID>"
%{ endif ~}
  # Blockchain
%{ if !eso_enabled ~}
  - name: SECP_MNEMONIC
    value: "<path:${vault_mount}/data/ixo-yellowcard-oracle#SECP_MNEMONIC>"
  - name: ORACLE_ENTITY_DID
    value: "<path:${vault_mount}/data/ixo-yellowcard-oracle#ORACLE_ENTITY_DID>"
%{ endif ~}
  # Database
%{ if !eso_enabled ~}
  - name: REDIS_URL
    value: "<path:${vault_mount}/data/ixo-yellowcard-oracle#REDIS_URL>"
%{ endif ~}
  # LLM
%{ if !eso_enabled ~}
  - name: OPENAI_API_KEY
    value: "<path:${vault_mount}/data/ixo-yellowcard-oracle#OPENAI_API_KEY>"
  - name: OPEN_ROUTER_API_KEY
    value: "<path:${vault_mount}/data/ixo-yellowcard-oracle#OPEN_ROUTER_API_KEY>"
%{ endif ~}
  # External Services
%{ if !eso_enabled ~}
  - name: MEMORY_MCP_URL
    value: "<path:${vault_mount}/data/ixo-yellowcard-oracle#MEMORY_MCP_URL>"
  - name: MEMORY_ENGINE_URL
    value: "<path:${vault_mount}/data/ixo-yellowcard-oracle#MEMORY_ENGINE_URL>"
  - name: FIRECRAWL_MCP_URL
    value: "<path:${vault_mount}/data/ixo-yellowcard-oracle#FIRECRAWL_MCP_URL>"
  - name: DOMAIN_INDEXER_URL
    value: "<path:${vault_mount}/data/ixo-yellowcard-oracle#DOMAIN_INDEXER_URL>"
  - name: SANDBOX_MCP_URL
    value: "<path:${vault_mount}/data/ixo-yellowcard-oracle#SANDBOX_MCP_URL>"
%{ endif ~}
  # Observability
%{ if !eso_enabled ~}
  - name: LANGSMITH_TRACING
    value: "<path:${vault_mount}/data/ixo-yellowcard-oracle#LANGSMITH_TRACING>"
  - name: LANGSMITH_ENDPOINT
    value: "<path:${vault_mount}/data/ixo-yellowcard-oracle#LANGSMITH_ENDPOINT>"
  - name: LANGSMITH_API_KEY
    value: "<path:${vault_mount}/data/ixo-yellowcard-oracle#LANGSMITH_API_KEY>"
  - name: LANGSMITH_PROJECT
    value: "<path:${vault_mount}/data/ixo-yellowcard-oracle#LANGSMITH_PROJECT>"
%{ endif ~}
  # Misc
%{ if !eso_enabled ~}
  - name: DISABLE_CREDITS
    value: "<path:${vault_mount}/data/ixo-yellowcard-oracle#DISABLE_CREDITS>"
  - name: CORS_ORIGIN
    value: "<path:${vault_mount}/data/ixo-yellowcard-oracle#CORS_ORIGIN>"
  - name: SUBSCRIPTION_URL
    value: "<path:${vault_mount}/data/ixo-yellowcard-oracle#SUBSCRIPTION_URL>"
  - name: ORACLE_SECRETS
    value: "<path:${vault_mount}/data/ixo-yellowcard-oracle#ORACLE_SECRETS>"
%{ endif ~}
service:
  port: 4000
resources:
  requests:
    memory: 256Mi
    cpu: "50m"
  limits:
    memory: 350Mi
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 1
  targetMemoryUtilizationPercentage: "30"
persistentVolume:
  storageClass: ${storage_class}
  size: ${storage_size}
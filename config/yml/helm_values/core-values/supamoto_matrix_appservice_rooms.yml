image:
  pullPolicy: Always
ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: ${host}
      paths:
        - path: /
          pathType: Prefix
persistentVolume:
  storageClass: ${storage_class}
  size: ${storage_size}
service:
  port: 8081
env:
  - name: "PORT"
    value: "8081"
resources:
  requests:
    memory: 150Mi
    cpu: "40m"
  limits:
    memory: 300Mi
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 1
  targetMemoryUtilizationPercentage: "30"
backup:
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      memory: 256Mi
  gcs:
    bucket: ${gcs_bucket}
config:
  homeserverUrl: https://matrix.supamoto.global
  homeserverName: matrix.supamoto.global
  userCreation:
    registrationToken: "<path:${vault_mount}/data/matrix#MATRIX_SUPAMOTO_APPSERVICE_ROOMS_USER_CREATION_REGISTRATION_TOKEN>"
  ucan:
    hostname: rooms.bot.matrix.supamoto.global
registration:
  hs_token: "<path:${vault_mount}/data/matrix#MATRIX_SUPAMOTO_APPSERVICE_ROOMS_HS_TOKEN>"
  as_token: "<path:${vault_mount}/data/matrix#MATRIX_SUPAMOTO_APPSERVICE_ROOMS_AS_TOKEN>"
  url: https://rooms.bot.matrix.supamoto.global
  namespaces:
    aliases:
      - exclusive: true
        regex: "#did-ixo-.*"
      - exclusive: true
        regex: "#ixo-room-bot-signature-hashes*"
      - exclusive: true
        regex: "#ixo.*-pod"
    users:
      - exclusive: true
        regex: "@ixo-room-bot:matrix.supamoto.global"
    rooms: []

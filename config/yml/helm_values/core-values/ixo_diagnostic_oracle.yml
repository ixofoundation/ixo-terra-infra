image:
  pullPolicy: Always
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
    acme.cert-manager.io/http01-edit-in-place: "true"
  tls:
    - hosts:
        - ${host}
      secretName: ixo-diagnostic-oracle-tls
  hosts:
    - host: ${host}
      paths:
        - path: /
          pathType: Prefix
service:
  port: 8081
%{ if eso_enabled ~}
externalSecret:
  enabled: true
  vaultPath: ixo-diagnostic-oracle
%{ endif ~}
env:
  - name: "PORT"
    value: "8081"
  - name: "NODE_ENV"
    value: "production"
resources:
  requests:
    memory: 350Mi
    cpu: "50m"
  limits:
    memory: 450Mi
podSecurityContext:
  fsGroup: 1000
securityContext:
  runAsUser: 1000
  runAsGroup: 1000
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 1
  targetMemoryUtilizationPercentage: "30"
persistentVolume:
  storageClass: ${storage_class}
  size: ${storage_size}

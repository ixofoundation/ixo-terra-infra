image:
  pullPolicy: Always
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
    acme.cert-manager.io/http01-edit-in-place: "true"
  tls:
    - hosts:
        - ${host}
      secretName: ixo-supamoto-3cx-server-tls
  hosts:
    - host: ${host}
      paths:
        - path: /
          pathType: Prefix
service:
  port: 8082
%{ if eso_enabled ~}
externalSecret:
  enabled: true
  vaultPath: ixo-supamoto-3cx-server
%{ endif ~}
env:
  - name: "PORT"
    value: "8082"
  - name: "NODE_ENV"
    value: "production"
resources:
  requests:
    memory: 250Mi
    cpu: "50m"
  limits:
    memory: 350Mi
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 1
  targetMemoryUtilizationPercentage: "30"
verticalPodAutoscaler:
  enabled: true
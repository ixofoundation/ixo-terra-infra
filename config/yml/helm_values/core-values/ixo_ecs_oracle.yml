image:
  pullPolicy: Always
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
    acme.cert-manager.io/http01-edit-in-place: "true"
  tls:
    - hosts:
        - ${host}
      secretName: ixo-ecs-oracle-tls
  hosts:
    - host: ${host}
      paths:
        - path: /
          pathType: Prefix
%{ if eso_enabled ~}
externalSecret:
  enabled: true
  vaultPath: ixo-ecs-oracle
%{ endif ~}
env:
  - name: NODE_ENV
    value: "production"
  - name: PORT
    value: "3000"
%{ if !eso_enabled ~}
  - name: OPEN_ROUTER_API_KEY
    value: "<path:${vault_mount}/data/ixo-ecs-oracle#OPEN_ROUTER_API_KEY>"
  - name: SECP_MNEMONIC
    value: "<path:${vault_mount}/data/ixo-ecs-oracle#SECP_MNEMONIC>"
  - name: ORACLE_ENTITY_DID
    value: "<path:${vault_mount}/data/ixo-ecs-oracle#ORACLE_ENTITY_DID>"
  - name: ORACLE_NAME
    value: "<path:${vault_mount}/data/ixo-ecs-oracle#ORACLE_NAME>"
  - name: MATRIX_BASE_URL
    value: "<path:${vault_mount}/data/ixo-ecs-oracle#MATRIX_BASE_URL>"
  - name: MATRIX_ORACLE_ADMIN_ACCESS_TOKEN
    value: "<path:${vault_mount}/data/ixo-ecs-oracle#MATRIX_ORACLE_ADMIN_ACCESS_TOKEN>"
  - name: MATRIX_ORACLE_ADMIN_PASSWORD
    value: "<path:${vault_mount}/data/ixo-ecs-oracle#MATRIX_ORACLE_ADMIN_PASSWORD>"
  - name: MATRIX_ORACLE_ADMIN_USER_ID
    value: "<path:${vault_mount}/data/ixo-ecs-oracle#MATRIX_ORACLE_ADMIN_USER_ID>"
  - name: MATRIX_RECOVERY_PHRASE
    value: "<path:${vault_mount}/data/ixo-ecs-oracle#MATRIX_RECOVERY_PHRASE>"
  - name: ORACLE_ADDRESS
    value: "<path:${vault_mount}/data/ixo-ecs-oracle#ORACLE_ADDRESS>"
  - name: ORACLE_DID
    value: "<path:${vault_mount}/data/ixo-ecs-oracle#ORACLE_DID>"
  - name: ORACLE_MNEMONIC
    value: "<path:${vault_mount}/data/ixo-ecs-oracle#ORACLE_MNEMONIC>"
  - name: MATRIX_VALUE_PIN
    value: "<path:${vault_mount}/data/ixo-ecs-oracle#MATRIX_VALUE_PIN>"
  - name: NETWORK
    value: "<path:${vault_mount}/data/ixo-ecs-oracle#NETWORK>"
  - name: REDIS_URL
    value: "<path:${vault_mount}/data/ixo-ecs-oracle#REDIS_URL>"
  - name: RPC_URL
    value: "<path:${vault_mount}/data/ixo-ecs-oracle#RPC_URL>"
  - name: BLOCKSYNC_GRAPHQL_URL
    value: "<path:${vault_mount}/data/ixo-ecs-oracle#BLOCKSYNC_GRAPHQL_URL>"
  - name: FIRECRAWL_MCP_URL
    value: "<path:${vault_mount}/data/ixo-ecs-oracle#FIRECRAWL_MCP_URL>"
  - name: DOMAIN_INDEXER_URL
    value: "<path:${vault_mount}/data/ixo-ecs-oracle#DOMAIN_INDEXER_URL>"
  - name: MEMORY_MCP_URL
    value: "<path:${vault_mount}/data/ixo-ecs-oracle#MEMORY_MCP_URL>"
  - name: MEMORY_ENGINE_URL
    value: "<path:${vault_mount}/data/ixo-ecs-oracle#MEMORY_ENGINE_URL>"
  - name: MEMORY_SERVICE_API_KEY
    value: "<path:${vault_mount}/data/ixo-ecs-oracle#MEMORY_SERVICE_API_KEY>"
  - name: MATRIX_ACCOUNT_ROOM_ID
    value: "<path:${vault_mount}/data/ixo-ecs-oracle#MATRIX_ACCOUNT_ROOM_ID>"
  - name: DISABLE_CREDITS
    value: "<path:${vault_mount}/data/ixo-ecs-oracle#DISABLE_CREDITS>"
  - name: THROW_ON_INSUFFICIENT_CREDITS
    value: "<path:${vault_mount}/data/ixo-ecs-oracle#THROW_ON_INSUFFICIENT_CREDITS>"
  - name: "SANDBOX_MCP_URL"
    value: "<path:${vault_mount}/data/ixo-ecs-oracle#SANDBOX_MCP_URL>"
  - name: "LANGSMITH_TRACING"
    value: "<path:${vault_mount}/data/ixo-ecs-oracle#LANGSMITH_TRACING>"
  - name: "LANGSMITH_ENDPOINT"
    value: "<path:${vault_mount}/data/ixo-ecs-oracle#LANGSMITH_ENDPOINT>"
  - name: "LANGSMITH_API_KEY"
    value: "<path:${vault_mount}/data/ixo-ecs-oracle#LANGSMITH_API_KEY>"
  - name: "LANGSMITH_PROJECT"
    value: "<path:${vault_mount}/data/ixo-ecs-oracle#LANGSMITH_PROJECT>"
  - name: "ECS_MCP_URL"
    value: "<path:${vault_mount}/data/ixo-ecs-oracle#ECS_MCP_URL>"
  - name: "ECS_MCP_AUTH_TOKEN"
    value: "<path:${vault_mount}/data/ixo-ecs-oracle#ECS_MCP_AUTH_TOKEN>"
  - name: "NODE_OPTIONS"
    value: "<path:${vault_mount}/data/ixo-ecs-oracle#NODE_OPTIONS>"
%{ endif ~}
service:
  port: 3000
resources:
  requests:
    memory: 1.3Gi
    cpu: "50m"
  limits:
    memory: 1.5Gi
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 1
  targetMemoryUtilizationPercentage: "30"
persistentVolume:
  storageClass: ${storage_class}
  size: ${storage_size}
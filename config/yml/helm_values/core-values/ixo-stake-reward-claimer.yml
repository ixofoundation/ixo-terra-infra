image:
  pullPolicy: Always
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
    acme.cert-manager.io/http01-edit-in-place: "true"
  tls:
    - hosts:
        - ${host}
      secretName: ixo-stake-reward-claimer-tls
  hosts:
    - host: ${host}
      paths:
        - path: /
          pathType: Prefix
%{ if eso_enabled ~}
externalSecret:
  enabled: true
  vaultPath: ixo-stake-reward-claimer
%{ endif ~}
env:
  - name: "PORT"
    value: "3000"
%{ if !eso_enabled ~}
  - name: "AUTHORIZATION"
    value: "<path:${vault_mount}/data/ixo-stake-reward-claimer#AUTHORIZATION>"
%{ endif ~}
  - name: "MIGRATE_DB_PROGRAMATICALLY"
    value: "1"
  - name: "DATABASE_USE_SSL"
    value: "1"
  - name: "RPC_URL"
    value: "${rpc_url}"
%{ if !eso_enabled ~}
  - name: "MNEMONIC"
    value: "<path:${vault_mount}/data/ixo-stake-reward-claimer#MNEMONIC>"
  - name: "SENTRYDSN"
    value: "<path:${vault_mount}/data/ixo-stake-reward-claimer#SENTRYDSN>"
%{ endif ~}
service:
  port: 3000
resources:
  requests:
    memory: 200Mi
    cpu: "50m"
  limits:
    memory: 350Mi
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 1
  targetMemoryUtilizationPercentage: "30"
image:
  pullPolicy: Always
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
    acme.cert-manager.io/http01-edit-in-place: "true"
  tls:
    - hosts:
        - ${host}
      secretName: ixo-matrix-recording-bot-tls
  hosts:
    - host: ${host}
      paths:
        - path: /
          pathType: Prefix
env:
  - name: NODE_ENV
    value: "production"
  - name: PORT
    value: "8087"
service:
  port: 8087
resources:
  requests:
    memory: 2Gi
    cpu: "50m"
  limits:
    memory: 2.5Gi
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 1
  targetMemoryUtilizationPercentage: "30"
persistentVolume:
  storageClass: ${storage_class}
  size: ${storage_size}
useDeploy: true

# The data volume is ReadWriteOnce: a RollingUpdate starts the new pod before stopping the old one,
# and if it lands on another node it can never attach the volume, so the rollout hangs forever.
strategy:
  type: Recreate
  rollingUpdate: null # clears the server-side-applied RollingUpdate params, which Recreate rejects

image:
  tag: "2.4.0"

podEnv:
  # Switches the SQLite knex pool from a single forced connection to WAL-mode
  # multi-connection (max 20), so the nightly clear-old-data job no longer
  # holds the only DB connection and starves monitor checks / the liveness
  # probe's own DB read. Known upstream issue: louislam/uptime-kuma#2470, #6486.
  - name: UPTIME_KUMA_SQLITE_SINGLE_CONNECTION
    value: "false"

livenessProbe:
  enabled: true # Disable for initial DB setup

readinessProbe:
  enabled: true # Disable for initial DB setup

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: ${host}
      paths:
        - path: /
          pathType: ImplementationSpecific
  annotations:
    nginx.org/proxy-body-size: 100M
    cert-manager.io/cluster-issuer: "letsencrypt-staging"
    acme.cert-manager.io/http01-edit-in-place: "true"
    nginx.org/use-regex: "true"
  tls:
    - hosts:
      - ${host}
      secretName: uptime-kuma-tls

volume:
  enabled: true
  accessMode: ReadWriteOnce
  size: 40Gi
  storageClassName: ${storage_class}

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi
    
apiVersion: postgres-operator.crunchydata.com/v1beta1
kind: PostgresCluster
metadata:
  name: ${pg_cluster_name}
  namespace: ${pg_namespace}
%{ if upgrade_name != "" ~}
  annotations:
    # Required by the operator before it will run the named PGUpgrade against this
    # cluster. Safe to set while the cluster is running; the upgrade job does not start
    # until spec.shutdown is true.
    postgres-operator.crunchydata.com/allow-upgrade: "${upgrade_name}"
%{ endif ~}
spec:
  # Stops all instances, releasing the data directory for pg_upgrade. The cluster is
  # unavailable to all clients while this is true.
  shutdown: ${shutdown}
  image: ${pg_image}:${pg_image_tag}
  postgresVersion: ${pg_version}
  service:
    metadata:
      annotations:
        tailscale.com/hostname: "${pg_cluster_name}-db-${environment}"
        tailscale.com/expose: "true"
%{ if enable_otel ~}
  # OpenTelemetry collector sidecar, replacing the pgmonitor exporter. Required for
  # Postgres 18 and above, which the exporter does not support. Metrics remain on
  # 9187/metrics, but the namespace is ccp_* rather than the exporter's pg_*; the
  # Prometheus rules in config/yml/helm_values/prometheus.yml match accordingly.
  instrumentation:
    logs:
      retentionPeriod: 1d
      exporters:
        - otlphttp/loki
    config:
      exporters:
        otlphttp/loki:
          logs_endpoint: http://loki.loki.svc.cluster.local:3100/otlp/v1/logs
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
    metrics:
      customQueries:
        # Drops the operator's built-in 5s pgbackrest-info query (removing every one of its
        # metric_names removes the query itself) and re-adds the same metrics via the
        # ConfigMap below at pgbackrest_metrics_interval. See that ConfigMap for why.
        remove:
          - ccp_backrest_last_diff_backup_time_since_completion_seconds
          - ccp_backrest_last_full_backup_time_since_completion_seconds
          - ccp_backrest_last_incr_backup_time_since_completion_seconds
          - ccp_backrest_last_info_backrest_repo_version
          - ccp_backrest_last_info_backup_error
          - ccp_backrest_last_info_backup_runtime_seconds
          - ccp_backrest_last_info_repo_backup_size_bytes
          - ccp_backrest_oldest_full_backup_time_seconds
        add:
          - name: pgbackrest-info-slow
            queries:
              name: ${pg_cluster_name}-pgbackrest-metrics-queries
              key: queries.yaml
            collectionInterval: ${pgbackrest_metrics_interval}
%{ else ~}
  monitoring:
    pgmonitor:
      exporter:
        image: ${pgmonitoring_image}:${pgmonitoring_image_tag}
        configuration:
          - configMap:
              name: promtail-config
              optional: true
          - configMap:
              name: ${pg_cluster_name}-exporter-queries-config
%{ endif ~}
  users:
    ${indent(4, pg_users)}
  instances:
    ${indent(4, pg_instances)}
  backups:
    pgbackrest:
      image: ${pgbackrest_image}:${pgbackrest_image_tag}
      global:
        repo1-gcs-key: /etc/pgbackrest/conf.d/gcs-key.json
        repo1-retention-full-type: "${retention_type}"
        repo1-retention-full: "${retention_full}"
%{ if gcs_repo2_bucket != "" ~}
        repo2-gcs-key: /etc/pgbackrest/conf.d/gcs-key.json
        repo2-path: /pgbackrest/repo2
        repo2-retention-full-type: "${repo2_retention_type}"
        repo2-retention-full: "${repo2_retention_full}"
%{ endif ~}
      configuration:
        - secret:
            name: ${pg_cluster_name}-gcs-pgbackrest-secret
      manual:
        repoName: repo1
        options:
          - --type=full
      repos:
        ${indent(8, pgbackrest_repos)}
  databaseInitSQL:
    key: init.sql
    name: ${pg_cluster_name}-init-sql
  patroni:
    dynamicConfiguration:
      # Keep the leader role through a loss of the DCS (the Kubernetes API) for as long as
      # the leader can still reach every other member over Patroni's REST API. Without it a
      # failed lease renewal on its own demotes a healthy primary, which is what triggered
      # all four mainnet failovers between 2026-08-26 and 2026-09-25 ("demoting self
      # because DCS is not accessible" / "failed to update leader lock in DCS"). A real
      # node-network partition still demotes, which is the wanted behaviour.
      failsafe_mode: true
%{ if enable_sync_replication ~}
      # Non-strict: when no standby is healthy Patroni clears synchronous_standby_names and
      # commits fall back to asynchronous, so a dead replica never blocks writes. While a
      # standby is streaming, a commit is acknowledged only after the standby has the WAL,
      # so a failover cannot lose an acknowledged write.
      synchronous_mode: true
%{ endif ~}
      postgresql:
        parameters:
%{ if enable_pg_cron ~}
          shared_preload_libraries: 'pg_cron'
          cron.database_name: '${pg_cron_database}'
%{ endif ~}
          log_checkpoints: 'on'
          max_connections: '200'
          log_statement: 'mod'
          log_line_prefix: '%t [%p]: host=%h user=%u,db=%d '
          log_lock_waits: 'on'
          logging_collector: 'on'
      bootstrap:
        initdb:
          - locale: C
          - encoding: C
%{ if enable_pgbouncer ~}
  proxy:
    pgBouncer:
      replicas: 2
      config:
        global:
          pool_mode: transaction
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 1
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  postgres-operator.crunchydata.com/cluster: ${pg_cluster_name}
                  postgres-operator.crunchydata.com/role: pgbouncer
%{ endif ~}